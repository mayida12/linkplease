services:
  - type: web
    name: linkplease-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    envVars:
      - key: MOCK_API_BASE_URL
        sync: false
      - key: MOCK_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: linkplease-db
          property: connectionString
      - key: DM_RATE_LIMIT_MAX
        value: "10"
      - key: DM_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: DM_MAX_ATTEMPTS
        value: "6"
      - key: DM_RETRY_BASE_SECONDS
        value: "5"
      - key: DM_RETRY_MAX_SECONDS
        value: "300"
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "1"
      - key: RECONCILE_POLL_INTERVAL_SECONDS
        value: "5"

  - type: worker
    name: linkplease-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.workers.run
    preDeployCommand: alembic upgrade head
    envVars:
      - key: MOCK_API_BASE_URL
        sync: false
      - key: MOCK_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: linkplease-db
          property: connectionString
      - key: DM_RATE_LIMIT_MAX
        value: "10"
      - key: DM_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: DM_MAX_ATTEMPTS
        value: "6"
      - key: DM_RETRY_BASE_SECONDS
        value: "5"
      - key: DM_RETRY_MAX_SECONDS
        value: "300"
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "1"
      - key: RECONCILE_POLL_INTERVAL_SECONDS
        value: "5"

databases:
  - name: linkplease-db
    plan: free
    databaseName: linkplease
    user: linkplease
