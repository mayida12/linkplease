services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: linkplease
      POSTGRES_PASSWORD: linkplease
      POSTGRES_DB: linkplease
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkplease"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://linkplease:linkplease@postgres:5432/linkplease
    command: alembic upgrade head

  api:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://linkplease:linkplease@postgres:5432/linkplease
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://linkplease:linkplease@postgres:5432/linkplease
    command: python -m app.workers.run

volumes:
  pgdata:
